<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kacper-dot-pl's Bio</title>
</head>
    <body>
    <div class="container">
        <div class="bio-card">
            <div class="profile-header">
                <h1 class="name">kacper-dot-pl</h1>
                <div class="title">Beginner Website Designer</div>
            </div>
            
            <p class="bio-text">
               I'm a beginner website designer.
            </p>
            
            <div class="social-links">

                <a href="https://github.com/kacper-dot-pl" class="social-link"> GitHub</a>
 
            </div>
            <style>
                   * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .bio-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin: 2rem 0;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 1rem;
        }
        
        .name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .title {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1rem;
        }
        
        .bio-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .social-link {
            color: #667eea;
            font-size: 1.5rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .social-link:hover {
            color: #764ba2;
        }
        
        .info-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .info-value {
            color: #666;
        }
        
        .quote {
            font-style: italic;
            font-size: 1.2rem;
            color: #555;
            text-align: center;
            border-top: 2px solid #f0f0f0;
            padding-top: 2rem;
            margin-top: 2rem;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s;
            margin-top: 1rem;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
        }
        
        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        
        .interest-tag {
            background: #f0f0f0;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .bio-card {
                padding: 1.5rem;
            }
            
            .name {
                font-size: 2rem;
            }
        }
            </style>
            <div class="info-section">
                <div class="info-item">
                    <div class="info-label">📍 Location</div>
                    <div class="info-value">Poland</div>
                </div>

            </div>
            
            <div class="interests">
                <span class="interest-tag">Web Development</span>
                <span class="interest-tag">Travel</span>
<span class="interest-tag">History</span>
            </div>
            

            
            <div class="quote">
                "Building tomorrow's web, one line of code at a time."
            </div>
        </div>
    </div>
</body>
</html>
